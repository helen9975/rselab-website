# Automatically pull publications from OpenAlex (https://openalex.org).
#
# Find an author id by searching:
#   https://api.openalex.org/authors?search=Firstname%20Lastname
# and taking the trailing part of the "id" url, e.g. A5108257764.
#
# Each work with a DOI is handed to Manubot for full citation details, exactly
# like a hand-written entry in sources.yaml. Anything you also list by hand in
# sources.yaml (thumbnail, description, buttons, tags, awards) is merged on top
# and wins, so curating a paper and auto-pulling it are not in conflict.
#
# To hide something that gets pulled in, add it to sources.yaml with:
#   - id: doi:10.1234/whatever
#     remove: true
#
# Options, all optional except "author":
#   from-year / to-year   only include works published in this range
#   types                 only include these OpenAlex work types
#   exclude-types         include everything except these types
#   require-doi           skip works with no DOI or PubMed id
#   dedupe-versions       collapse arXiv preprint + published version of the
#                         same paper, preferring published (defaults to true)
#
# Types seen on this author's record: preprint, conference-paper, article,
# book-chapter, dataset, report, book, conference-abstract, editorial, other.

# OpenAlex splits Dieter Fox across many author records rather than one, and
# new papers routinely land on a brand new single-work record. Listing only the
# main id silently missed every 2026 paper, so list all known ids AND sweep by
# raw author name to catch records that don't exist yet.
- author:
    - A5108257764 # main record, 511 works
    - A5031489518
    - A5130146151
    - A5135398273
    - A5137940387
    - A5133302190
    - A5126576649
    - A5133227027
    - A5135522340
  # deliberately NOT A5057540280 — a different Dieter Fox (coal mining, fire
  # detection). The "fields" restriction below guards against others like him.
  name-search: dieter fox
  fields:
    - 17 # computer science
    - 22 # engineering
  # Dieter Fox also publishes through industry appointments, so keep only work
  # he did with someone else from the lab. The roster is built from the team
  # page, alumni.yaml and allowed_authors.yaml — add publishing names that
  # differ from the site's spelling to that last file.
  require-coauthor: true
  lead-author: Dieter Fox
  from-year: 2024
  exclude-types:
    - dataset
    - editorial
    - other
    - conference-abstract
    - peer-review
    - software
